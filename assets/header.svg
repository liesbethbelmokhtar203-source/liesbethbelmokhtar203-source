<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="880" height="200" rx="0"/>
    </clipPath>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- thin guide lines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="24" x2="880" y2="24" opacity="0.7"/>
    <line x1="0" y1="176" x2="880" y2="176" opacity="0.7"/>
    <line x1="48" y1="0" x2="48" y2="200" opacity="0.4"/>
    <line x1="560" y1="0" x2="560" y2="200" opacity="0.4"/>
  </g>
  <g fill="#30363d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
    <text x="14" y="20">main</text>
    <text x="836" y="192" text-anchor="end">v1.4.2</text>
  </g>

  <!-- left text block -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="82" fill="#e6edf3" font-size="34" font-weight="600" letter-spacing="0.5">Liesbeth Belmokhtar</text>
    <text x="64" y="114" fill="#FF694B" font-size="15" font-weight="500" letter-spacing="3">DATA ENGINEER</text>
    <text x="64" y="150" fill="#7d8590" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">dbt · SQL · Airflow · DuckDB · Postgres · Rust</text>
  </g>
  <line x1="64" y1="126" x2="196" y2="126" stroke="#FF694B" stroke-width="1.5" opacity="0.85"/>
  <line x1="200" y1="126" x2="212" y2="126" stroke="#58a6a6" stroke-width="1.5" opacity="0.7"/>

  <!-- right: pipeline animation -->
  <g clip-path="url(#bannerClip)">
    <!-- pipe -->
    <rect x="600" y="86" width="260" height="28" rx="14" fill="url(#pipeGrad)" stroke="#30363d" stroke-width="1"/>
    <line x1="616" y1="100" x2="844" y2="100" stroke="#58a6a6" stroke-width="1" opacity="0.25" stroke-dasharray="3 5"/>

    <!-- columnar ticks inside pipe -->
    <g stroke="#3d444d" stroke-width="1">
      <line x1="640" y1="90" x2="640" y2="110"/>
      <line x1="672" y1="90" x2="672" y2="110"/>
      <line x1="704" y1="90" x2="704" y2="110"/>
      <line x1="736" y1="90" x2="736" y2="110"/>
      <line x1="768" y1="90" x2="768" y2="110"/>
      <line x1="800" y1="90" x2="800" y2="110"/>
      <line x1="832" y1="90" x2="832" y2="110"/>
    </g>

    <!-- drifting data nodes -->
    <g>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#FF694B" opacity="0.9">
        <animate attributeName="x" values="596;866" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#58a6a6" opacity="0.8">
        <animate attributeName="x" values="596;866" dur="7s" begin="-2.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.85;1" dur="7s" begin="-2.33s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#c9d1d9" opacity="0.55">
        <animate attributeName="x" values="596;866" dur="7s" begin="-4.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.12;0.85;1" dur="7s" begin="-4.66s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- stage labels -->
    <g fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5">
      <text x="600" y="76">extract</text>
      <text x="700" y="76">transform</text>
      <text x="818" y="76">load</text>
    </g>
    <g stroke="#30363d" stroke-width="1">
      <line x1="600" y1="80" x2="600" y2="86"/>
      <line x1="700" y1="80" x2="700" y2="86"/>
      <line x1="818" y1="80" x2="818" y2="86"/>
    </g>

    <!-- progress bar under pipe -->
    <rect x="600" y="134" width="260" height="3" rx="1.5" fill="#21262d"/>
    <rect x="600" y="134" width="0" height="3" rx="1.5" fill="#FF694B" opacity="0.8">
      <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.8;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
      <text x="600" y="156">dag: warehouse_daily</text>
      <text x="860" y="156" text-anchor="end" fill="#58a6a6">success</text>
    </g>

    <!-- connector from text to pipe -->
    <path d="M 520 100 H 596" stroke="#30363d" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- blinking cursor bottom-right -->
  <rect x="846" y="160" width="8" height="14" fill="#FF694B">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>